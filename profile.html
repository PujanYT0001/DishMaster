<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | DishMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-avatar {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: var(--transition-smooth);
        }
        .profile-avatar:hover .avatar-overlay {
            opacity: 1;
        }
        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            opacity: 0;
            transition: var(--transition-smooth);
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        #photoInput {
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-utensils"></i> DishMaster
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline" id="loginBtn">Login</a>
                <a href="profile.html" class="user-profile-icon" id="userProfileIcon" style="display:none">
                    <i class="fas fa-user-circle fa-2x"></i>
                </a>
                <button onclick="logout()" class="btn btn-outline btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <main style="padding-top: 120px; padding-bottom: 80px;">
        <div class="container">
            <div class="profile-header" style="background: var(--bg-white); padding: 40px; border-radius: 30px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 30px; margin-bottom: 50px;">
                <div class="profile-avatar" id="avatarBtn" onclick="document.getElementById('photoInput').click()" style="width: 120px; height: 120px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem;">
                    <img id="profileImage" src="" alt="" style="display: none;">
                    <i id="defaultAvatarIcon" class="fas fa-user"></i>
                    <div class="avatar-overlay">
                        <i class="fas fa-camera"></i>
                    </div>
                </div>
                <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(event)">
                <div class="profile-info">
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 0;">
                        <h1 id="userName" style="font-size: 2.5rem; margin-bottom: 0;">User Name</h1>
                        <button onclick="editProfile()" class="btn btn-outline btn-sm" style="padding: 5px 10px; font-size: 0.8rem;">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                    </div>
                    <p id="userHandle" style="color: var(--primary); font-weight: 600; margin-bottom: 15px; font-size: 1.1rem;"></p>
                    <p id="userEmail" style="color: var(--text-muted); font-size: 1rem; margin-bottom: 20px;"></p>
                    <div class="profile-stats" style="display: flex; gap: 15px;">
                        <div class="stat-badge" style="background: var(--bg-cream); padding: 10px 20px; border-radius: 15px; border: 1px solid var(--border-color);">
                            <i class="fas fa-bookmark" style="color: var(--primary); margin-right: 8px;"></i>
                            <strong id="savedCount">0</strong> Saved
                        </div>
                        <div class="stat-badge" style="background: var(--bg-cream); padding: 10px 20px; border-radius: 15px; border: 1px solid var(--border-color);">
                            <i class="fas fa-star" style="color: #FFB800; margin-right: 8px;"></i>
                            <strong>2</strong> Reviews
                        </div>
                    </div>
                </div>
            </div>

            <section class="saved-recipes">
                <h2 style="margin-bottom: 30px;">My Saved Recipes</h2>
                <div class="recipes-grid" id="savedRecipesGrid">
                    <!-- Content injected via JS -->
                </div>
            </section>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('dm-user'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('userName').textContent = user.name;
            document.getElementById('userHandle').textContent = `@${user.username || 'user'}`;
            document.getElementById('userEmail').textContent = user.email;

            // Load profile photo if exists
            const savedPhoto = localStorage.getItem(`dm-profile-photo-${user.email}`);
            if (savedPhoto) {
                const img = document.getElementById('profileImage');
                const icon = document.getElementById('defaultAvatarIcon');
                img.src = savedPhoto;
                img.style.display = 'block';
                icon.style.display = 'none';
            }

            renderSavedRecipes();
        });

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                const user = JSON.parse(localStorage.getItem('dm-user'));
                
                // Store photo
                localStorage.setItem(`dm-profile-photo-${user.email}`, base64Image);
                
                // Update UI
                const img = document.getElementById('profileImage');
                const icon = document.getElementById('defaultAvatarIcon');
                img.src = base64Image;
                img.style.display = 'block';
                icon.style.display = 'none';

                // Update nav icons if they exist
                updateNavProfileIcons(base64Image);
                
                alert('Profile photo updated successfully!');
            };
            reader.readAsDataURL(file);
        }

        function updateNavProfileIcons(photoData) {
            const navIcons = document.querySelectorAll('#userProfileIcon i');
            navIcons.forEach(icon => {
                const parent = icon.parentElement;
                parent.innerHTML = `<img src="${photoData}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">`;
            });
        }

        function editProfile() {
            const user = JSON.parse(localStorage.getItem('dm-user'));
            const newName = prompt("Enter your full name:", user.name);
            const newUsername = prompt("Enter your username:", user.username || "user");

            if (newName && newUsername) {
                user.name = newName;
                user.username = newUsername;
                
                // Update session
                localStorage.setItem('dm-user', JSON.stringify(user));
                
                // Update "mock database"
                localStorage.setItem(`dm-user-data-${user.email}`, JSON.stringify({
                    email: user.email,
                    name: user.name,
                    username: user.username
                }));

                // Update UI
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userHandle').textContent = `@${user.username}`;
                
                alert("Profile updated successfully!");
            }
        }

        function renderSavedRecipes() {
            const grid = document.getElementById('savedRecipesGrid');
            const favorites = JSON.parse(localStorage.getItem('dm-favorites') || '[]');
            
            document.getElementById('savedCount').textContent = favorites.length;

            if (favorites.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px;"><p>You haven\'t saved any recipes yet.</p><a href="recipes.html" class="btn btn-primary" style="margin-top: 20px;">Browse Recipes</a></div>';
                return;
            }

            const savedRecipes = window.recipeData.filter(r => favorites.includes(r.id));

            grid.innerHTML = savedRecipes.map(recipe => `
                <div class="recipe-card">
                    <div class="recipe-img">
                        <img src="${recipe.image}" alt="${recipe.name}">
                    </div>
                    <div class="recipe-info">
                        <h3 class="recipe-name">${recipe.name}</h3>
                        <div class="recipe-footer">
                            <a href="recipe-detail.html?id=${recipe.id}" class="btn btn-primary btn-sm">View Recipe</a>
                            <button onclick="removeFavorite('${recipe.id}')" style="color: var(--accent); font-size: 1.2rem;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function removeFavorite(id) {
            window.Utils.removeFromFavorites(id);
            renderSavedRecipes();
        }

        function logout() {
            localStorage.removeItem('dm-user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
