<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup | DishMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 150px auto 80px;
            background: var(--bg-white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .auth-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            margin-bottom: -2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            outline: none;
            transition: var(--transition-smooth);
            color: white;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }
        .social-login {
            margin-top: 30px;
            text-align: center;
        }
        .social-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            font-size: 1.2rem;
            transition: var(--transition-smooth);
        }
        .social-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-utensils"></i> DishMaster
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle"><i class="fas fa-moon"></i></button>
                <a href="login.html" class="btn btn-outline" id="loginBtn">Login</a>
                <a href="profile.html" class="user-profile-icon" id="userProfileIcon" style="display:none">
                    <i class="fas fa-user-circle fa-2x"></i>
                </a>
            </div>
        </div>
    </nav>

    <main>
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" onclick="switchTab('signup')">Sign Up</div>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name">
                </div>
                <div class="form-group" id="usernameGroup" style="display: none;">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    <span id="submitText">Login</span>
                </button>
            </form>

            <div class="social-login">
                <p style="font-size: 0.85rem; color: var(--text-muted);">Or continue with</p>
                <div class="social-btns">
                    <button class="social-btn"><i class="fab fa-google"></i></button>
                    <button class="social-btn"><i class="fab fa-facebook-f"></i></button>
                    <button class="social-btn"><i class="fab fa-apple"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'login';

function switchTab(mode) {
    currentMode = mode;
    // Update active tab based on mode
    document.querySelectorAll('.auth-tab').forEach(tab => {
        if ((mode === 'login' && tab.textContent.trim() === 'Login') ||
            (mode === 'signup' && tab.textContent.trim() === 'Sign Up')) {
            tab.classList.add('active');
        } else {
            tab.classList.remove('active');
        }
    });
    const nameGroup = document.getElementById('nameGroup');
    const usernameGroup = document.getElementById('usernameGroup');
    const submitText = document.getElementById('submitText');
    const passwordInput = document.getElementById('password');

    if (mode === 'signup') {
        nameGroup.style.display = 'block';
        usernameGroup.style.display = 'block';
        submitText.textContent = 'Create Account';
        passwordInput.placeholder = 'Create a password';
    } else {
        nameGroup.style.display = 'none';
        usernameGroup.style.display = 'none';
        submitText.textContent = 'Login';
        passwordInput.placeholder = 'Enter your password';
    }
}

        // Duplicate switchTab function removed – the earlier implementation handles tab switching.


        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // Try to get existing user data for this email (mock database)
            let existingUser = JSON.parse(localStorage.getItem(`dm-user-data-${email}`));
            
            let name, username;
            if (currentMode === 'signup') {
                name = document.getElementById('fullName').value || 'User';
                username = document.getElementById('username').value || name.toLowerCase().replace(/\s+/g, '');
                // Save this user data permanently in our mock DB
                existingUser = { email, name, username };
                localStorage.setItem(`dm-user-data-${email}`, JSON.stringify(existingUser));
            } else {
                // Login mode
                if (existingUser) {
                    name = existingUser.name;
                    username = existingUser.username;
                } else {
                    // Fallback for new login without previous signup
                    name = 'User';
                    username = 'user';
                }
            }
            
            // Set current session
            localStorage.setItem('dm-user', JSON.stringify({ email, name, username, loggedIn: true }));
            alert(currentMode === 'login' ? 'Welcome back!' : 'Account created successfully!');
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
