<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup | DishMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 150px auto 80px;
            background: var(--bg-white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .auth-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            margin-bottom: -2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-cream);
            outline: none;
            transition: var(--transition-smooth);
        }
        .form-group input:focus {
            border-color: var(--primary);
            background: white;
        }
        .social-login {
            margin-top: 30px;
            text-align: center;
        }
        .social-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            font-size: 1.2rem;
            transition: var(--transition-smooth);
        }
        .social-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-utensils"></i> DishMaster
            </a>
            <div class="nav-actions">
                <button class="theme-toggle"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <main>
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" onclick="switchTab('signup')">Sign Up</div>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    <span id="submitText">Login</span>
                </button>
            </form>

            <div class="social-login">
                <p style="font-size: 0.85rem; color: var(--text-muted);">Or continue with</p>
                <div class="social-btns">
                    <button class="social-btn"><i class="fab fa-google"></i></button>
                    <button class="social-btn"><i class="fab fa-facebook-f"></i></button>
                    <button class="social-btn"><i class="fab fa-apple"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            const nameGroup = document.getElementById('nameGroup');
            const submitText = document.getElementById('submitText');
            
            if (mode === 'signup') {
                nameGroup.style.display = 'block';
                submitText.textContent = 'Create Account';
            } else {
                nameGroup.style.display = 'none';
                submitText.textContent = 'Login';
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const name = document.getElementById('fullName').value || 'User';
            
            // Mock authentication
            localStorage.setItem('dm-user', JSON.stringify({ email, name, loggedIn: true }));
            alert(currentMode === 'login' ? 'Welcome back!' : 'Account created successfully!');
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
